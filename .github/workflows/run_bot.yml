name: Run Bot Cycle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # الدورة (~1 د) + مراقبة لصيقة لحد 24 د لو فيه صفقة مفتوحة
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run one bot cycle (+ watch open positions)
        # لو فيه صفقة مفتوحة، البوت بيفضل يفحص سعرها كل دقيقة لحد 24 دقيقة
        # بدل ما يستنى الدورة الجاية، عشان الستوب يتنفذ قريب من سعره.
        # الخطوة ليها timeout خاص عشان خطوة الـcommit (if: always()) تلحق تشتغل.
        timeout-minutes: 28
        env:
          WATCH_MAX_MINUTES: "24"
          WATCH_INTERVAL_SECONDS: "60"
        run: python3 scripts/run_bot_cycle.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "solana-meme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine_state.json data/discovery_seen.db dashboard/snapshot.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Bot cycle: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
