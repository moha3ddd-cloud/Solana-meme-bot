name: Crypto Day Trader — Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "عدد الأيام"
        default: "90"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Run backtest
        working-directory: crypto_daytrader
        run: python3 scripts/backtest.py ${{ github.event.inputs.days }} | tee reports/backtest.txt
      - name: Commit report
        run: |
          git config user.name "crypto-daytrader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add crypto_daytrader/reports/backtest.json crypto_daytrader/reports/backtest.txt
          git diff --staged --quiet || git commit -m "Backtest report"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
