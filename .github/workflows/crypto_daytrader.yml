name: Crypto Day Trader (paper)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-daytrader
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Run one cycle
        working-directory: crypto_daytrader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # اختياري — لتقييم الأخبار بـClaude
        run: python3 scripts/run_cycle.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "crypto-daytrader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add crypto_daytrader/data/state.json crypto_daytrader/dashboard/snapshot.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Day-trader cycle: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
