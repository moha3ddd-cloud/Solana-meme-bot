name: Backtest Shadow

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Run backtest
        run: python3 scripts/backtest_shadow.py
      - name: Save report
        if: always()
        run: |
          git config user.name "solana-meme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/backtest_report.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Backtest report"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
