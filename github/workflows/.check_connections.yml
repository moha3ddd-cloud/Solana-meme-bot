name: Check Connections

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run connection checks
        id: check
        continue-on-error: true
        run: python3 scripts/check_connections.py

      - name: Save report to repo
        if: always()
        run: |
          git config user.name "solana-meme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/connection_report.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Connection check report"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true

      - name: Fail the run if a core check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
