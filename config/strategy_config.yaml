# ============================================================
# Strategy / Entry Signal Config
# ============================================================
# ملحوظة: الـScanner (scanner_config.yaml) بيحكم على "أمان" العملة.
# الملف ده بيحكم على "التوقيت" — هل دلوقتي لحظة كويسة للدخول؟
# لازم الاتنين يوافقوا قبل ما يتفتح أي صفقة.

entry_signals:
  minimum_signal_score: 65   # الحد الأدنى لدرجة التوقيت (منفصلة عن score الـScanner)

  weights:
    momentum: 0.30            # اتجاه السعر آخر فترة قصيرة
    volume_acceleration: 0.25 # هل حجم التداول بيتسارع دلوقتي
    buy_pressure_recent: 0.25 # نسبة الشراء للبيع في آخر دقايق (مش آخر ساعة)
    breakout_confirmation: 0.20  # كسر مستوى مقاومة بحجم تداول مؤكد

  # لازم عدد أدنى من الإشارات الإيجابية منفصلة، مش بس متوسط مرجح عالي
  # (عشان مانعتمدش على عامل واحد قوي جدًا يغطي على ضعف الباقي)
  min_positive_signals_required: 2

cooldown:
  # بعد ما نطلع من عملة (ربح أو خسارة)، منمنعش نفس العملة لفترة
  # عشان نتجنب "revenge entry" أو تذبذب سعر لحظي
  same_token_cooldown_minutes: 60
