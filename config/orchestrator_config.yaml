# ============================================================
# Orchestrator (Main Loop) Config
# ============================================================
# الـRiskEngine بيحسب حجم الصفقة من مسافة الـStop Loss، لكنه معندوش
# رأي في "فين نحط الستوب أول مرة" — ده قرار استراتيجية، مش إدارة
# مخاطر. الرقم هنا هو نفس المبدأ اللي استخدمناه في كل التجارب اليدوية
# (Bagwork/Franklin): 10% تحت سعر الدخول.
#
# ⚠️ ده مبدئي وبسيط عمدًا لحد ما نجمع بيانات حقيقية كافية (عبر
# Paper Trading نفسه) تقولنا هل 10% مناسب لمسار السكالب والمحافظ
# بنفس القدر، ولا لازم يختلف زي باقي الإعدادات.
default_initial_stop_loss_pct: 10.0

# ------------------------------------------------------------
# مسارات "ظل" (Shadow): بتتقيّم وبتتسجّل قراراتها بس، ومابتفتحش صفقات.
# السكالب هنا لأن: الدورة كل ~30 دقيقة بطيئة جدًا لسكالب، ومصدر العملات
# (profiles/boosts) متأخر، وإشارات كسر القمة/حجم الاختراق مش شغالة، ومفيش
# Backtest على شموع حقيقية، والـ3 صفقات الأولى كلها خسرت. نفضل نقيس
# اختياراته (data/shadow_log.json) لحد ما الأرقام تقول إنها تستاهل.
# فاضي [] = كل المسارات بتتداول Paper.
# ------------------------------------------------------------
shadow_only_profiles: ["scalp"]

# بعد كام دقيقة من التقييم نقيس سعر العملة (بيتقاس في بداية أقرب دورة بعدها)
shadow_horizons_minutes: [30, 60, 120]

# ------------------------------------------------------------
# تحديث السعر قبل الدخول: لو مسار شغّال وافق، بنجيب سعر طازة (الـpair الحي) قبل
# ما نفتح الصفقة. لو اتحرك عن سعر الاكتشاف بأكتر من النسبة دي (لفوق أو لتحت)
# بنرفض الدخول (entry_price_drifted)، ولو تمام بندخل بالسعر الطازة. 0 = مقفول.
# السبب: صفقتين محافظ اتضربوا في الستوب بعد 1-3 دقايق من الدخول.
# ------------------------------------------------------------
max_entry_price_drift_pct: 5.0

# ------------------------------------------------------------
# قواعد دخول مرشّحة بتتقاس في الـshadow log من غير تداول (الملخص: groups["rule:<اسم>"]).
# كل قاعدة بتتطبّق على كل السجلات (القديمة كمان) وقت حساب الملخص.
# الفكرة: بيانات أول أسبوع بتقول إن مطاردة العملة وهي طالعة (m5 >= 15%) أسوأ فئة،
# وإن العملات الهادية (m5 بين -5 و+5) أحسن. بنقيس ده بدقة قبل ما نصدّقه.
# ⚠️ كل ما نجرّب قواعد أكتر، احتمال إننا نلاقي "نمط" بالصدفة بيزيد — القاعدة
# اللي تنجح لازم تتأكد على بيانات جديدة (out-of-sample) قبل أي تداول.
# ------------------------------------------------------------
shadow_rules:
  calm_entry:           # عدّت الفلاتر + حركة هادية
    passed_hard_filters: true
    m5_min: -5
    m5_max: 5
  calm_in_uptrend:      # هادية على 5 دقايق لكن صاعدة على ساعة (تراجع داخل اتجاه صاعد)
    passed_hard_filters: true
    m5_min: -5
    m5_max: 5
    h1_min: 10
  chasing_pump:         # قاعدة ضابطة للمقارنة: مطاردة بعد طلعة قوية
    passed_hard_filters: true
    m5_min: 15
  passed_filters_any:   # أي عملة عدّت الفلاتر (خط الأساس للمقارنة)
    passed_hard_filters: true
