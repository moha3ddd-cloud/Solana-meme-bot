# ============================================================
# Strategy / Entry Signal Config — مسار السكالب
# ============================================================
# الفرق عن المسار المحافظ (strategy_config.yaml): وزن أكبر بكتير
# للحركة اللحظية (momentum + breakout)، وأقل اعتماد على buy pressure
# "الهادئ" — سكالب بطبيعته بيلاحق انفجار لحظي، مش تراكم تدريجي.
#
# ⚠️ ملحوظة صراحة: minimum_signal_score هنا **أعلى** من المحافظ مش
# أقل — القرار ده مقصود. سكالب بطبيعته أكتر عرضة لـfalse signals
# (حركة سعر عشوائية من صفقة واحدة كبيرة، مش اتجاه حقيقي)، فمعناش
# "سكالب = فلترة أسهل". العكس هو الصح: لازم تأكيد أقوى قبل الدخول
# لأن مساحة الخطأ (وقت الخروج القريب أوي) أصغر بكتير.

entry_signals:
  minimum_signal_score: 72   # أعلى من المحافظ (65) — تأكيد أقوى مطلوب

  weights:
    momentum: 0.40              # الوزن الأكبر — سكالب بيلاحق حركة حالة
    volume_acceleration: 0.30   # تسارع الحجم أهم من مستواه المطلق
    buy_pressure_recent: 0.20
    breakout_confirmation: 0.10 # وزن أقل — مش كل صفقة سكالب لازم كسر مقاومة

  min_positive_signals_required: 3   # أعلى من المحافظ (2) — نفس منطق التأكيد الأقوى

cooldown:
  # فترة أقصر من المحافظ (60 دقيقة) — سكالب بطبيعته بيرجع لنفس العملة
  # أسرع لو فيه حركة مستمرة، لكن لسه بنمنع revenge entry فوري
  same_token_cooldown_minutes: 20
